<!DOCTYPE html>
<html>
<head>
<title>Spider-Man Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
font-family:Arial, sans-serif;
overflow:hidden;
}

/* Spider-Man Login Background */

#page1{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("https://wallpapercave.com/wp/wp2757874.jpg") center/cover no-repeat;
}

/* Second Page Monkey Background */

#page2{
display:none;
height:100vh;
justify-content:center;
align-items:center;
flex-direction:column;
background:url("https://wallpapercave.com/wp/wp4030097.jpg") center/cover no-repeat;
color:white;
text-align:center;
}

/* 3D Card */

.card{
background:rgba(255,255,255,0.9);
padding:30px;
border-radius:15px;
box-shadow:0 20px 40px rgba(0,0,0,0.4);
transform: perspective(1000px) rotateY(0deg);
transition:0.5s;
width:300px;
}

.card:hover{
transform: perspective(1000px) rotateY(10deg);
}

/* Form */

input,select{
width:100%;
padding:10px;
margin:8px 0;
border-radius:6px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
border:none;
background:#e62429;
color:white;
font-size:16px;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#c51f23;
}

h1{
font-size:40px;
text-shadow:2px 2px 10px black;
}

</style>
</head>

<body>

<!-- PAGE 1 -->

<div id="page1">

<div class="card">

<h2>🕷️ Spider-Man Login</h2>

<input id="name" placeholder="Enter your name">

<select id="gender">
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input id="phone" placeholder="Phone number">

<input id="age" placeholder="Age">

<button onclick="login()">Login</button>

</div>

</div>

<!-- PAGE 2 -->

<div id="page2">

<h1 id="welcome"></h1>
<p style="font-size:125px;">Welcome to my website </p>

</div>

<script>

function login(){

let name=document.getElementById("name").value;

if(name==""){
alert("Please enter your name");
return;
}

document.getElementById("page1").style.display="none";
document.getElementById("page2").style.display="flex";

document.getElementById("welcome").innerText="Hello "+name+"!";

}

</script>

</body>
</html>
