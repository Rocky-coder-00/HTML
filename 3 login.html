<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3B Secure Login</title>
    <style>
      /* Main Page Background - Solid Black */
      body {
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #000000; /* Pure Black */
        margin: 0;
        color: #ffffff;
      }

      /* The Login Card - Dark Grey/Black */
      .login-card {
        background: #1a1a1a;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 255, 0, 0.1); /* Subtle green glow */
        border: 1px solid #333;
        text-align: center;
      }

      h2 {
        margin-bottom: 1.5rem;
        color: #00ff00; /* Hacker Green Title */
        letter-spacing: 2px;
      }

      /* Inputs - Dark themed */
      input {
        display: block;
        margin: 15px 0;
        padding: 12px;
        width: 280px;
        border: 1px solid #444;
        border-radius: 6px;
        background-color: #0a0a0a;
        color: #00ff00; /* Text you type is green */
        outline: none;
      }

      input:focus {
        border-color: #00ff00;
      }

      /* Button - Bright Blue contrast */
      button {
        width: 100%;
        padding: 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 1rem;
        transition: 0.3s;
      }

      button:hover {
        background: #0056b3;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.5);
      }

      /* Warning Page (Hidden) */
      #warning-page {
        display: none;
        text-align: center;
      }

      .error-box {
        color: #ff0000;
        border: 2px solid #ff0000;
        padding: 50px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div id="login-section" class="login-card">
      <h2>3B LOGIN</h2>
      <input type="text" id="name" placeholder="Name" required />
      <input type="number" id="age" placeholder="Age" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <button onclick="handleLogin()">Login</button>
    </div>

    <div id="warning-page">
      <div class="error-box">
        <h1 style="font-size: 3rem">⚠️ CRITICAL ERROR</h1>
        <p style="font-size: 1.5rem">
          YOUR PHONE OR LAPTOP CAN'T HANDLE THIS WEBSITE
        </p>
        <hr style="border: 0.5px solid #ff0000" />
        <div
          id="captured-data"
          style="color: #888; margin-top: 20px; font-family: monospace"
        ></div>
      </div>
    </div>

    <script>
      function handleLogin() {
        const name = document.getElementById("name").value;
        const age = document.getElementById("age").value;
        const phone = document.getElementById("phone").value;

        if (!name || !age || !phone) {
          alert("Please fill in all fields.");
          return;
        }

        // Hide the login, show the error
        document.getElementById("login-section").style.display = "none";
        document.getElementById("warning-page").style.display = "block";

        // Show that the info was captured
        document.getElementById("captured-data").innerHTML =
          `INFO_CAPTURED: ${name} | ${age}YRS | ${phone}`;
      }
    </script>
  </body>
</html>
