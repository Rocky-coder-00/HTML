<!DOCTYPE html>
<html>
    <head>
        <title>
            a program of application form

        </title>
    </head>
    <body>
        <h1 align="center">application form</h1>
        <form>
            <table border="2" width="600" cellpadding="0"align ="center"bgcolour="pink">
        <tr>
            <th colspan="2">personal information</th>
        </tr>
        <tr>
            <td>first name</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>middle name</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>last name</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>phone no</td>
            <td><input type text="text"></td>
        </tr>
        <tr>
            <td>email</td>
            <td><input type text="text"></td>
        </tr>
        <tr>
            <td>gender</td>
        <td>
        <input type="radio" name="gender">male
        <input type="radio" name="gender">female
        <input type="radio" name="gender">other
        </td>
        </tr>
        <tr>
            <td>address</td>
            <td><textarea row="3" cols"30"></textarea></td>
</tr>
<tr>
    <th colspan="2">education detail</th>
</tr>
<tr>
            <td>10th</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>12th</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>graduation</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <td>other</td>
            <td><input type text="text"</td>
        </tr>
        <tr>
            <th colspan="2">experience</th>
        </tr>
        <tr>
            <td>experience(in months)</td>
            <td><input type="numbered"></td>
        </tr>
        <tr>
            <td colspan="2"align="center">
                <input type="submit" value="submit application">
                <input type="reset" value="reset">
            </td>
        </tr>

            </table>
</form>
    </body>
</html>
