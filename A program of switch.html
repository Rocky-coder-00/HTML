<html>
<head>

<title>a program of switch</title>

</head>

<body>

<script type="text/javascript"> var day=prompt("enter day"); switch(parseInt(day))

{

case 1:

document.write("sunday");

break;

case 2:

document.write("monday");

break;

case 3:

document.write("tuesday");

break;

default:

document.write("any other day");

break;

}

</script>

</body>

</html>
