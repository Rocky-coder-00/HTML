<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiderman Multiverse Login</title>
    <style>
        /* Global Styles */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Arial Black', sans-serif; overflow: hidden; 
            background: #000;
        }

        /* 3D Background Layer */
        #bg-layer {
            position: fixed;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background: url('https://images.alphacoders.com/133/1337920.jpeg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.5) contrast(1.2);
            z-index: -1;
            transition: transform 0.1s ease-out;
            transform: perspective(1000px);
        }

        /* PAGE 1: LOGIN STYLES */
        #login-page {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; perspective: 1000px;
        }

        .login-card {
            background: rgba(180, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            border: 3px solid #e23636;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            color: white;
            box-shadow: 0 20px 50px rgba(226, 54, 54, 0.3);
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }

        .login-card:hover {
            transform: rotateY(10deg) rotateX(5deg);
        }

        h1 { text-shadow: 3px 3px #000; color: #fff; margin-bottom: 30px; }
        
        input {
            width: 100%; padding: 15px; margin: 10px 0;
            border: none; border-radius: 8px; font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%; padding: 15px; border: none;
            background: #e23636; color: white; cursor: pointer;
            font-weight: bold; font-size: 18px; border-radius: 8px;
            transition: 0.3s; margin-top: 15px;
            box-shadow: 0 5px 0 #8b0000;
        }

        button:active { transform: translateY(4px); box-shadow: none; }

        /* PAGE 2: RESULT STYLES (Hidden by default) */
        #result-page {
            display: none;
            flex-direction: column; justify-content: center; align-items: center;
            height: 100vh; background: #000; color: white;
        }

        .middle-finger { font-size: 180px; filter: drop-shadow(0 0 20px red); }
        .user-name { font-size: 60px; color: #ffcc00; margin-top: 20px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div id="login-page">
        <div class="login-card">
            <h1>SPIDER-MAN<br><span style="font-size: 0.5em; color: #e23636;">ACCESS DENIED?</span></h1>
            <input type="text" id="username" placeholder="Type Your Name..." required>
            <input type="password" placeholder="Password (Any)">
            <button onclick="goToPage2()">LOGIN TO WEB</button>
        </div>
    </div>

    <div id="result-page">
        <div class="middle-finger">🖕</div>
        <div class="user-name" id="nameDisplay"></div>
        <button onclick="location.reload()" style="width: 200px; margin-top: 50px;">TRY AGAIN?</button>
    </div>

    <script>
        // 3D Mouse Movement Logic
        const bg = document.getElementById('bg-layer');
        document.addEventListener('mousemove', (e) => {
            let x = (window.innerWidth / 2 - e.pageX) / 25;
            let y = (window.innerHeight / 2 - e.pageY) / 25;
            bg.style.transform = `translateX(${x}px) translateY(${y}px) scale(1.1)`;
        });

        // Switching Logic
        function goToPage2() {
            const name = document.getElementById('username').value;
            
            if(name.trim() === "") {
                alert("Please enter a name first!");
                return;
            }

            // Update Name
            document.getElementById('nameDisplay').innerText = name;

            // Hide Page 1, Show Page 2
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('bg-layer').style.display = 'none'; // Clear bg for impact
            document.getElementById('result-page').style.display = 'flex';
        }
    </script>
</body>
</html>
