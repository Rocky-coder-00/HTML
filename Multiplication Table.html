<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Multiplication Table for 5</h1>
    <table>
        <tr>
            <th>Multiplier</th>
            <th>Result</th>
        </tr>
        <tr><td>5 x 1</td><td>5</td></tr>
        <tr><td>5 x 2</td><td>10</td></tr>
        <tr><td>5 x 3</td><td>15</td></tr>
        <tr><td>5 x 4</td><td>20</td></tr>
        <tr><td>5 x 5</td><td>25</td></tr>
        <tr><td>5 x 6</td><td>30</td></tr>
        <tr><td>5 x 7</td><td>35</td></tr>
        <tr><td>5 x 8</td><td>40</td></tr>
        <tr><td>5 x 9</td><td>45</td></tr>
        <tr><td>5 x 10</td><td>50</td></tr>
    </table>
</body>
</html>
