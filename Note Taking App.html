<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note Taking App</title>

<style>
body{
    font-family: Arial;
    background:#f4f4f4;
    text-align:center;
}

.container{
    width:90%;
    max-width:600px;
    margin:auto;
}

h1{
    margin-top:20px;
}

textarea{
    width:100%;
    height:100px;
    padding:10px;
    margin-top:10px;
}

button{
    padding:10px 15px;
    margin-top:10px;
    background:#007bff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.note{
    background:white;
    padding:15px;
    margin-top:10px;
    border-radius:5px;
    text-align:left;
    position:relative;
}

.delete{
    position:absolute;
    right:10px;
    top:10px;
    background:red;
}
</style>

</head>

<body>

<div class="container">

<h1>📝 Notes App</h1>

<textarea id="noteInput" placeholder="Write your note..."></textarea>
<br>
<button onclick="addNote()">Add Note</button>

<div id="notes"></div>

</div>

<script>

let notes = JSON.parse(localStorage.getItem("notes")) || [];

function displayNotes(){
    let notesDiv = document.getElementById("notes");
    notesDiv.innerHTML = "";

    notes.forEach((note,index)=>{
        notesDiv.innerHTML += `
        <div class="note">
            ${note}
            <button class="delete" onclick="deleteNote(${index})">X</button>
        </div>
        `;
    });
}

function addNote(){
    let input = document.getElementById("noteInput");
    if(input.value.trim() === "") return;

    notes.push(input.value);
    localStorage.setItem("notes", JSON.stringify(notes));
    input.value = "";
    displayNotes();
}

function deleteNote(index){
    notes.splice(index,1);
    localStorage.setItem("notes", JSON.stringify(notes));
    displayNotes();
}

displayNotes();

</script>

</body>
</html>
