<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered List of Fruits</title>
    <style>
        ol {
            list-style-type: decimal; /* Default numbered style */
            margin: 20px;
            padding-left: 20px;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Ordered List of Fruits</h1>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Grape</li>
        <li>Mango</li>
        <li>Strawberry</li>
        <li>Pineapple</li>
        <li>Watermelon</li>
        <li>Kiwi</li>
        <li>Peach</li>
    </ol>
</body>
</html>
