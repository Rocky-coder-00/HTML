<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typing Practice</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111;
        color: #ddd;
        text-align: center;
        padding: 40px;
      }

      .container {
        max-width: 900px;
        margin: auto;
      }

      #textDisplay {
        background: #1e1e1e;
        padding: 20px;

        border-radius: 10px;
        font-size: 22px;
        line-height: 35px;
        margin-bottom: 20px;
      }

      .correct {
        color: #4caf50;
      }

      .incorrect {
        color: #ff5252;
        text-decoration: underline;
      }

      .current {
        background: #333;
      }

      textarea {
        width: 100%;
        height: 100px;
        font-size: 18px;
        padding: 10px;
        border-radius: 8px;
        border: none;
      }

      .stats {
        margin-top: 20px;
        font-size: 18px;
      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        background: #facc15;
        cursor: pointer;
        border-radius: 5px;
      }

      button:hover {
        background: #eab308;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>⌨️ Typing Speed Trainer</h1>

      <div id="textDisplay"></div>

      <textarea
        id="input"
        placeholder="Start typing here..."
        oninput="checkTyping()"
      ></textarea>

      <div class="stats">
        <p>⏱ Time: <span id="time">0</span>s</p>
        <p>⚡ WPM: <span id="wpm">0</span></p>
        <p>🎯 Accuracy: <span id="accuracy">100</span>%</p>
      </div>

      <button onclick="resetTest()">Restart</button>
    </div>

    <script>
      const text =
        "practice typing daily to improve your typing speed and accuracy coding and typing skills are important for developers and students who work with computers regularly";

      const textDisplay = document.getElementById("textDisplay");
      const input = document.getElementById("input");

      let startTime = null;

      function loadText() {
        textDisplay.innerHTML = "";
        text.split("").forEach((char) => {
          const span = document.createElement("span");
          span.innerText = char;
          textDisplay.appendChild(span);
        });
      }

      function checkTyping() {
        const typed = input.value.split("");
        const spans = textDisplay.querySelectorAll("span");

        let correct = 0;

        if (!startTime) {
          startTime = new Date().getTime();
        }

        spans.forEach((span, index) => {
          const char = typed[index];

          if (char == null) {
            span.classList.remove("correct", "incorrect");
          } else if (char === span.innerText) {
            span.classList.add("correct");
            span.classList.remove("incorrect");
            correct++;
          } else {
            span.classList.add("incorrect");
            span.classList.remove("correct");
          }
        });

        let time = (new Date().getTime() - startTime) / 1000;

        let words = input.value.trim().split(/\s+/).length;
        let wpm = Math.round((words / time) * 60);

        let accuracy = Math.round((correct / typed.length) * 100) || 100;

        document.getElementById("time").innerText = time.toFixed(1);
        document.getElementById("wpm").innerText = isFinite(wpm) ? wpm : 0;
        document.getElementById("accuracy").innerText = accuracy;
      }

      function resetTest() {
        input.value = "";
        startTime = null;
        loadText();

        document.getElementById("time").innerText = 0;
        document.getElementById("wpm").innerText = 0;
        document.getElementById("accuracy").innerText = 100;
      }

      loadText();
    </script>
  </body>
</html>
