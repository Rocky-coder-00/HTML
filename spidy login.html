<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man: Web Access</title>
    <style>
        :root {
            --spidey-red: #E62429;
            --spidey-blue: #005A9C;
            --spidey-black: #151515;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #2b2b2b, #000);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
        }

        /* 3D Card Effect */
        .container {
            perspective: 1000px;
        }

        .card {
            background: rgba(20, 20, 20, 0.9);
            width: 350px;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--spidey-red);
            box-shadow: 0 20px 50px rgba(230, 36, 41, 0.3);
            transform: rotateX(10deg);
            transition: transform 0.5s;
            text-align: center;
            position: relative;
        }

        .card:hover {
            transform: rotateX(0deg) scale(1.02);
        }

        .card::before {
            content: '🕸️';
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            opacity: 0.5;
        }

        h2 { color: var(--spidey-red); text-transform: uppercase; letter-spacing: 2px; }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #222;
            border: 1px solid var(--spidey-blue);
            color: white;
            border-radius: 5px;
            outline: none;
        }

        input:focus { border-color: var(--spidey-red); }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: var(--spidey-red);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
        }

        button:hover { background: var(--spidey-blue); letter-spacing: 1px; }

        /* Second Page (Hidden) */
        #error-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .glitch {
            font-size: 3rem;
            color: var(--spidey-red);
            font-weight: bold;
            animation: shake 0.1s infinite;
            text-shadow: 2px 2px var(--spidey-blue);
        }

        .info-leak {
            background: #111;
            padding: 20px;
            border: 1px dashed #555;
            margin-top: 20px;
            color: #0f0;
            font-family: 'Courier New', monospace;
        }

        @keyframes shake {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, -2px); }
        }
    </style>
</head>
<body>

    <div id="login-container" class="container">
        <div class="card">
            <h2>Web-Head Login</h2>
            <p>Access the Multiverse</p>
            <input type="text" id="name" placeholder="Hero Name" required>
            <input type="number" id="age" placeholder="Age" required>
            <input type="tel" id="phone" placeholder="Phone (Contact Peter)" required>
            <button onclick="processData()">SIGN IN</button>
        </div>
    </div>

    <div id="error-page">
        <div class="glitch">SYSTEM OVERLOAD</div>
        <p style="font-size: 1.5rem; margin: 20px;">YOUR DEVICE CANNOT HANDLE SPIDEY SENSE</p>
        
        <div class="info-leak" id="data-display">
            </div>
        
        <p style="color: #666; margin-top: 30px;">[ERROR] Processor melting... Web fluid leaking...</p>
    </div>

    <script>
        function processData() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const phone = document.getElementById('phone').value;

            if(!name || !age || !phone) {
                alert("The Avengers need your full details!");
                return;
            }

            // Capture data for display on screen
            const display = document.getElementById('data-display');
            display.innerHTML = `
                RECEIVED DATA:<br>
                > NAME: ${name}<br>
                > AGE: ${age}<br>
                > PHONE: ${phone}<br><br>
                STATUS: Hardware incompatible. Data captured.
            `;

            // Log to console (so you can see it "sent")
            console.log("Form Submitted:", {name, age, phone});

            // Transition
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('error-page').style.display = 'flex';
        }
    </script>
</body>
</html>
